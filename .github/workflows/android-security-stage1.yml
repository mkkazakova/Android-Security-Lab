
name: Android Security Lab - Stage 1 Sandbox IPC

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-stage1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Fix existing Kotlin build files
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Migrate Kotlin compiler settings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = '    kotlinOptions { jvmTarget = "17" }'
          new = '''kotlin {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
              }
          }
          '''

          for module in ('owner', 'client'):
              file = Path(module) / 'build.gradle.kts'
              if not file.is_file():
                  raise SystemExit(f'Missing build file: {file}')
              text = file.read_text(encoding='utf-8')

              if old in text:
                  text = text.replace(old, '', 1).rstrip() + '\n\n' + new
                  file.write_text(text, encoding='utf-8')
                  print(f'Updated: {file}')
              elif ('compilerOptions' in text and 'JvmTarget.JVM_17' in text):
                  print(f'Already migrated: {file}')
              else:
                  raise SystemExit(f'Unknown Kotlin configuration: {file}')
          PY

      - name: Commit migration (only two Gradle files)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- owner/build.gradle.kts client/build.gradle.kts
          if git diff --cached --quiet; then
            echo 'No source changes required.'
          else
            git commit -m 'fix(build): migrate Kotlin compiler options [skip ci]'
            git push origin "HEAD:${{ github.ref_name }}"
          fi

  android-tests:
    name: Sandbox IPC / Android API ${{ matrix.api }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    strategy:
      fail-fast: false
      matrix:
        api: [33, 36]

    steps:
      - name: Checkout latest source files
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Install Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build platform
        shell: bash
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Build the two applications
        shell: bash
        run: ./gradlew :owner:assembleDebug :client:assembleDebug --no-daemon --stacktrace

      - name: Enable KVM acceleration
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Run Stage 1 experiments on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          cores: 2
          script: bash scripts/run-stage1.sh

      - name: Summarize test results
        if: always()
        shell: bash
        env:
          TEST_API: ${{ matrix.api }}
        run: |
          report="results/stage1-api-${TEST_API}/report.json"
          {
            echo "### Stage 1, Android API ${TEST_API}"
            if [ -f "$report" ]; then
              echo '```json'
              cat "$report"
              echo '```'
            else
              echo 'No report was generated. Inspect the failed build or emulator step.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: securitylab-api-${{ matrix.api }}
          path: results/stage1-api-${{ matrix.api }}/
          if-no-files-found: warn
          retention-days: 14

  publish-readme:
    name: Publish Stage 1 results to README
    needs: [prepare, android-tests]
    if: ${{ always() && needs.prepare.result == 'success' && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Download this run's test reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: securitylab-api-*
          path: downloaded
          merge-multiple: false

      - name: Update only the Stage 1 section in README
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import shutil
          from datetime import datetime, timezone
          from pathlib import Path

          start = '<!-- ANDROID_STAGE1_START -->'
          end = '<!-- ANDROID_STAGE1_END -->'
          readme = Path('README.md')
          screenshots = Path('docs/screenshots')
          screenshots.mkdir(parents=True, exist_ok=True)

          tests = {
              'S1': 'Owner читает собственный приватный файл',
              'S2': 'Client пытается прочитать приватный файл Owner',
              'S3': 'Client обращается к закрытому ContentProvider',
              'S4': 'Client обращается к открытому ContentProvider',
              'S5': 'Client обращается к Provider с signature-разрешением',
          }

          reports = {}
          pictures = {}
          for api, android in [(33, '13'), (36, '16')]:
              folder = Path('downloaded') / f'securitylab-api-{api}'
              try:
                  reports[api] = json.loads((folder / 'report.json').read_text(encoding='utf-8'))
              except (OSError, ValueError):
                  reports[api] = None

              for kind in ('owner', 'client'):
                  src = folder / f'{kind}.png'
                  dest = screenshots / f'stage1-android-{android}-{kind}.png'
                  if reports[api] and src.is_file() and src.read_bytes().startswith(b'\x89PNG\r\n\x1a\n'):
                      shutil.copyfile(src, dest)
                      pictures[(api, kind)] = f'<img src="{dest.as_posix()}" width="240" alt="{kind}, Android {android}">'
                  else:
                      # Do not show an old screenshot as evidence for a new run.
                      pictures[(api, kind)] = 'Скриншот отсутствует'

          def show(api, experiment):
              report = reports[api]
              if not report:
                  return 'НЕТ ОТЧЁТА'
              record = next((r for r in report.get('results', []) if r.get('id') == experiment), None)
              if not record:
                  return 'НЕ ВЫПОЛНЕН'
              observed = str(record.get('observed', '?')).replace('|', '/').replace('\n', ' ')
              return ('PASS' if record.get('pass') is True else 'FAIL') + f' ({observed})'

          now = datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')
          run_url = (
              f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
              f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          )
          lines = [
              start,
              '## Эксперименты: Application Sandbox и IPC',
              '',
              f'Обновлено: **{now}**. [Запуск GitHub Actions]({run_url}).',
              '',
              '| Сценарий | Android 13 (API 33) | Android 16 (API 36) |',
              '|---|---|---|',
          ]
          for test_id, title in tests.items():
              lines.append(f'| **{test_id}** — {title} | {show(33, test_id)} | {show(36, test_id)} |')

          def overall(api):
              return str(reports[api].get('status', 'UNKNOWN')) if reports[api] else 'NO REPORT'

          lines.extend([
              '',
              f'**Итог:** Android 13 — {overall(33)}; Android 16 — {overall(36)}.',
              '',
              '### Скриншоты последнего запуска',
              '',
              '| Приложение | Android 13 | Android 16 |',
              '|---|---|---|',
          ])
          for kind, title in [('owner', 'SecurityOwner'), ('client', 'SecurityClient')]:
              lines.append(f'| {title} | {pictures[(33, kind)]} | {pictures[(36, kind)]} |')
          lines.extend([
              '',
              '> Данные получены из Android Emulator; аппаратные механизмы защиты смартфона здесь не проверяются.',
              '> Отсутствующий отчёт не считается успешным экспериментом. Полные журналы доступны в Artifacts запуска.',
              '',
              end,
          ])
          block = '\n'.join(lines)
          original = readme.read_text(encoding='utf-8') if readme.is_file() else '# Android Security Lab\n'

          if start in original and end in original:
              before, remainder = original.split(start, 1)
              _, after = remainder.split(end, 1)
              updated = before.rstrip() + '\n\n' + block + after
          elif start not in original and end not in original:
              updated = original.rstrip() + '\n\n' + block + '\n'
          else:
              raise SystemExit('README has incomplete Stage 1 markers; refusing to overwrite it.')

          readme.write_text(updated.rstrip() + '\n', encoding='utf-8')
          PY

      - name: Commit README and current screenshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md
          git add -A -- docs/screenshots/
          if git diff --cached --quiet; then
            echo 'No README changes.'
          else
            git commit -m 'docs: publish Stage 1 test results [skip ci]'
            git push origin "HEAD:${{ github.ref_name }}"
          fi
