
name: Android Security Lab - Sandbox IPC and Runtime Permissions

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-security-stage2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-tests:
    name: Eight experiments / Android API ${{ matrix.api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    strategy:
      fail-fast: false
      matrix:
        api: [33, 36]

    steps:
      - name: Checkout project
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install build platform
        shell: bash
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Verify Stage 2 files
        shell: bash
        run: |
          set -euo pipefail
          test -f client/src/main/java/org/example/securitylab/client/PermissionProbeActivity.kt
          test -f scripts/run-stage1.sh
          test -f scripts/run-stage2.sh
          test -f experiments/permissions.md
          bash -n scripts/run-stage1.sh scripts/run-stage2.sh

      - name: Build both applications
        shell: bash
        run: ./gradlew :owner:assembleDebug :client:assembleDebug --no-daemon --stacktrace

      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Run S1-S5 and P1-P3 in Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          cores: 2
          script: bash scripts/run-stage2.sh

      - name: Show JSON result in GitHub Actions
        if: always()
        shell: bash
        env:
          TEST_API: ${{ matrix.api }}
        run: |
          report="results/stage1-api-${TEST_API}/report.json"
          {
            echo "### Stage 2: Android API ${TEST_API}"
            if [ -f "$report" ]; then
              echo '```json'
              cat "$report"
              echo '```'
            else
              echo 'Report missing. Inspect the failed step; do not interpret as PASS.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: securitylab-api-${{ matrix.api }}
          path: results/stage1-api-${{ matrix.api }}/
          if-no-files-found: warn
          retention-days: 14

  publish-readme:
    name: Publish eight experiments to README
    needs: android-tests
    if: ${{ always() && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Checkout project
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Download evidence from this run
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: securitylab-api-*
          path: downloaded
          merge-multiple: false

      - name: Update only the experiment results section
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import shutil
          from datetime import datetime, timezone
          from pathlib import Path

          start = '<!-- ANDROID_STAGE1_START -->'
          end = '<!-- ANDROID_STAGE1_END -->'
          readme = Path('README.md')
          screenshots = Path('docs/screenshots')
          screenshots.mkdir(parents=True, exist_ok=True)

          descriptions = {
              'S1': 'Owner читает собственный приватный файл',
              'S2': 'Client пытается прочитать приватный файл Owner',
              'S3': 'Client обращается к закрытому ContentProvider',
              'S4': 'Client обращается к открытому ContentProvider',
              'S5': 'Client обращается к защищённому разрешением ContentProvider',
              'P1': 'CAMERA: разрешение отсутствует',
              'P2': 'CAMERA: разрешение выдано',
              'P3': 'CAMERA: разрешение отозвано',
          }

          reports = {}
          screenshots_md = {}

          for api, version in ((33, '13'), (36, '16')):
              folder = Path('downloaded') / f'securitylab-api-{api}'

              try:
                  data = json.loads(
                      (folder / 'report.json').read_text(
                          encoding='utf-8'
                      )
                  )

                  if not isinstance(data, dict) or data.get('api') != api:
                      raise ValueError('Wrong API or malformed report')

                  reports[api] = data

              except (OSError, ValueError):
                  reports[api] = None

              for kind in ('owner', 'client'):
                  source = folder / f'{kind}.png'
                  target = screenshots / f'stage1-android-{version}-{kind}.png'

                  if (
                      reports[api] is not None
                      and source.is_file()
                      and source.read_bytes().startswith(b'\x89PNG\r\n\x1a\n')
                  ):
                      shutil.copyfile(source, target)
                      screenshots_md[(api, kind)] = (
                          f'<img src="{target.as_posix()}" width="240" '
                          f'alt="{kind}, Android {version}">'
                      )
                  else:
                      target.unlink(missing_ok=True)
                      screenshots_md[(api, kind)] = (
                          'Нет скриншота текущего запуска'
                      )

          def result(api, test_id):
              data = reports[api]

              if data is None:
                  return 'НЕТ ОТЧЁТА'

              found = next(
                  (
                      x for x in data.get('results', [])
                      if isinstance(x, dict)
                      and x.get('id') == test_id
                  ),
                  None
              )

              if found is None:
                  return 'НЕ ВЫПОЛНЕН'

              observed = str(found.get('observed', '?'))
              observed = (
                  observed.replace('|', '/')
                  .replace('\n', ' ')
                  .replace('\r', ' ')
              )

              if found.get('pass') is True:
                  return f'PASS ({observed})'

              if observed == 'ERROR':
                  return 'ERROR'

              return f'FAIL ({observed})'

          def overall(api):
              data = reports[api]

              if data is None:
                  return 'NO REPORT'

              if len(data.get('results', [])) < 8:
                  return 'INCOMPLETE'

              return str(data.get('status', 'UNKNOWN'))

          now = datetime.now(timezone.utc).strftime(
              '%Y-%m-%d %H:%M UTC'
          )

          run_url = (
              f"{os.environ['GITHUB_SERVER_URL']}/"
              f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
              f"{os.environ['GITHUB_RUN_ID']}"
          )

          lines = [
              start,
              '## Эксперименты: Sandbox, IPC и Runtime Permissions',
              '',
              f'Последнее испытание: **{now}**. '
              f'[Открыть запуск GitHub Actions]({run_url}).',
              '',
              '| Сценарий | Android 13 (API 33) | Android 16 (API 36) |',
              '|---|---|---|',
          ]

          for test_id, description in descriptions.items():
              lines.append(
                  f'| **{test_id}** — {description} | '
                  f'{result(33, test_id)} | {result(36, test_id)} |'
              )

          lines.extend([
              '',
              f'**Итог:** Android 13 — {overall(33)}; '
              f'Android 16 — {overall(36)}.',
              '',
              '### Скриншоты последнего запуска',
              '',
              '| Приложение | Android 13 | Android 16 |',
              '|---|---|---|',
          ])

          for kind, title in [
              ('owner', 'SecurityOwner'),
              ('client', 'SecurityClient')
          ]:
              lines.append(
                  f'| {title} | {screenshots_md[(33, kind)]} | '
                  f'{screenshots_md[(36, kind)]} |'
              )

          lines.extend([
              '',
              '> Результаты относятся к Android Emulator, '
              'а не к аппаратной защите смартфона. '
              'P1–P3 проверяют состояние разрешения внутри приложения '
              'после изменения его через ADB.',
              '',
              '> Полные JSON-отчёты и журналы доступны '
              'в Artifacts указанного запуска.',
              '',
              end,
          ])

          block = '\n'.join(lines)

          original = (
              readme.read_text(encoding='utf-8')
              if readme.is_file()
              else '# Android Security Lab\n'
          )

          if start in original and end in original:
              before, remainder = original.split(start, 1)
              _, after = remainder.split(end, 1)

              updated = (
                  before.rstrip() + '\n\n' + block + after
              )

          elif start not in original and end not in original:
              updated = (
                  original.rstrip() + '\n\n' + block + '\n'
              )

          else:
              raise SystemExit(
                  'README markers are inconsistent: refusing to overwrite'
              )

          readme.write_text(
              updated.rstrip() + '\n',
              encoding='utf-8'
          )
          PY

      - name: Commit README and current screenshots
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -- README.md
          git add -A -- docs/screenshots/

          if git diff --cached --quiet; then
            echo 'No README changes.'
          else
            git commit -m 'docs: publish eight Android security experiments [skip ci]'
            git push origin "HEAD:${{ github.ref_name }}"
          fi
