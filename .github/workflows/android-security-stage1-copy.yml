      - name: Generate official Gradle wrapper once
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            workdir="$(mktemp -d)"
            printf 'plugins { base }\n' > "$workdir/build.gradle.kts"
            (cd "$workdir" && gradle wrapper --gradle-version 8.13)
            mkdir -p gradle/wrapper
            cp "$workdir/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/
            cp "$workdir/gradle/wrapper/gradle-wrapper.properties" gradle/wrapper/
            cp "$workdir/gradlew" "$workdir/gradlew.bat" ./
            chmod +x gradlew
          fi
      - name: Commit generated source code
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- settings.gradle.kts build.gradle.kts gradle.properties .gitignore owner client scripts docs/experiments/STAGE1.md gradle gradlew gradlew.bat
          if git diff --cached --quiet; then
            echo 'No source changes.'
          else
            git commit -m "feat: add Stage 1 Android Sandbox IPC test project [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

  android-tests:
    name: Sandbox IPC / Android API ${{ matrix.api }}
    needs: initialize
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        api: [33, 36]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v4
      - name: Install Android platform for compilation
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Build SecurityOwner and SecurityClient
        run: ./gradlew :owner:assembleDebug :client:assembleDebug --no-daemon --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run five experiments in Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          cores: 2
          script: bash scripts/run-stage1.sh
      - name: Write run summary
        if: always()
        shell: bash
        run: |
          if [ -f "results/stage1-api-${{ matrix.api }}/report.json" ]; then
            echo '### Stage 1 - API ${{ matrix.api }}' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "results/stage1-api-${{ matrix.api }}/report.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Stage 1 API ${{ matrix.api }}: report not created; inspect build/emulator logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: securitylab-api-${{ matrix.api }}
          path: results/stage1-api-${{ matrix.api }}/
          if-no-files-found: warn
          retention-days: 14

  publish-readme:
    name: Publish Stage 1 results to README
    needs: [initialize, android-tests]
    if: ${{ always() && needs.initialize.result == 'success' && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: securitylab-api-*
          path: downloaded
      - name: Generate README section and copy screenshots
        shell: bash
        run: |
          python3 - <<'PY_PUBLISH'
          import json, os, shutil
          from datetime import datetime, timezone
          from pathlib import Path
          start='<!-- ANDROID_STAGE1_START -->'
          end='<!-- ANDROID_STAGE1_END -->'
          readme=Path('README.md')
          images=Path('docs/screenshots')
          images.mkdir(parents=True, exist_ok=True)
          reports={}
          rows=[]
          for api, version in ((33,'13'),(36,'16')):
              folder=Path('downloaded')/f'securitylab-api-{api}'
              report=folder/'report.json'
              try:
                  data=json.loads(report.read_text(encoding='utf-8'))
              except (OSError,ValueError):
                  data=None
              reports[api]=data
              for kind in ('owner','client'):
                  dest=images/f'stage1-android-{version}-{kind}.png'
                  source=folder/f'{kind}.png'
                  if data and source.is_file() and source.read_bytes().startswith(b'\x89PNG\r\n\x1a\n'):
                      shutil.copyfile(source,dest)
                  else:
                      dest.unlink(missing_ok=True)
          lines=[start,'## Эксперименты: изоляция приложений и IPC','',
              'Данные получены при автоматизированном запуске двух обычных приложений в Android Emulator.',
              f'Обновлено: {datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")}.',
              f'[Открыть запуск GitHub Actions]({os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}).','',
              '| Сценарий | Android 13 (API 33) | Android 16 (API 36) |','|---|---|---|']
          descriptions={
              'S1':'Owner читает собственный приватный файл',
              'S2':'Client пытается напрямую читать приватный файл Owner',
              'S3':'Client обращается к закрытому ContentProvider',
              'S4':'Client обращается к открытому ContentProvider',
              'S5':'Client обращается к Provider с signature-разрешением'
          }
          def status(api, key):
              data=reports[api]
              if not data: return 'НЕТ ОТЧЁТА'
              result=next((item for item in data.get('results',[]) if item.get('id')==key),None)
              if not result: return 'НЕ ВЫПОЛНЕН'
              observed=str(result.get('observed','?')).replace('|','/')
              return ('PASS' if result.get('pass') else 'FAIL')+' ('+observed+')'
          for key, desc in descriptions.items():
              lines.append(f'| **{key}** — {desc} | {status(33,key)} | {status(36,key)} |')
          overall=[reports[api].get('status','FAIL') if reports[api] else 'NO REPORT' for api in (33,36)]
          lines.extend(['',f'**Итог:** Android 13 — {overall[0]}; Android 16 — {overall[1]}.','',
              '### Фактические скриншоты приложений','',
              '| Android 13 | Android 16 |','|---|---|'])
          for kind,label in [('owner','SecurityOwner'),('client','SecurityClient')]:
              cells=[]
              for version in ('13','16'):
                  image=f'docs/screenshots/stage1-android-{version}-{kind}.png'
                  cells.append(f'<img src="{image}" width="240" alt="{label} Android {version}">' if Path(image).is_file() else 'Нет изображения')
              lines.append(f'| {cells[0]} | {cells[1]} |')
          lines.extend(['',
              '> Это результаты испытаний **виртуальных устройств**, а не физического смартфона. '
              'Проверка S2 подтверждается только при наличии исходного файла у Owner; '
              'проверка S4 используется как положительный контроль для IPC.',
              '',
              'Подробные JSON-отчёты, журналы и изображения доступны в разделе Artifacts указанного запуска.',
              '',end])
          section='\n'.join(lines)
          original=readme.read_text(encoding='utf-8') if readme.is_file() else '# Android Security Research Lab\n'
          if start in original and end in original:
              before,following=original.split(start,1)
              _,after=following.split(end,1)
              new=before.rstrip()+'\n\n'+section+after
          elif start not in original and end not in original:
              new=original.rstrip()+'\n\n'+section+'\n'
          else:
              raise RuntimeError('README has only one stage1 section marker')
          readme.write_text(new.rstrip()+'\n',encoding='utf-8')
          PY_PUBLISH
      - name: Commit README and screenshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- README.md docs/screenshots/
          if ! git diff --cached --quiet; then
            git commit -m "docs: publish Android Sandbox IPC evidence [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
