name: Android Security Lab - Update Project (Stage 3)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-security-project-update
  cancel-in-progress: false

jobs:
  update-project:
    name: Add Scoped Storage experiments F1-F3
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Create or update Stage 3 source files
        shell: bash
        run: |
          set -euo pipefail
          test -f owner/src/main/AndroidManifest.xml
          test -f client/src/main/AndroidManifest.xml
          test -f scripts/run-stage1.sh
          test -f scripts/run-stage2.sh

          write_managed() {
            local dest="$1" marker="$2" tmp
            tmp="$(mktemp)"
            cat > "$tmp"
            if [ -f "$dest" ] && ! grep -Fq "$marker" "$dest"; then
              echo "Refusing to overwrite unmanaged file: $dest" >&2
              rm -f "$tmp"
              return 1
            fi
            mkdir -p "$(dirname "$dest")"
            if [ ! -f "$dest" ] || ! cmp -s "$dest" "$tmp"; then
              mv "$tmp" "$dest"
              echo "Updated $dest"
            else
              rm -f "$tmp"
              echo "Unchanged $dest"
            fi
          }

          write_managed "owner/src/main/java/org/example/securitylab/owner/StorageProbeActivity.kt" 'Managed by project-update.yml' <<'STAGE3_OWNERSTORAGEPROBEACTIVITY_KT'
          // Managed by project-update.yml - Stage 3
          package org.example.securitylab.owner

          import android.app.Activity
          import android.os.Bundle
          import android.util.Log
          import android.widget.TextView
          import org.json.JSONObject
          import java.io.File

          class StorageProbeActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val expected = "ALLOW"
                  var observed = "ERROR"
                  var detail = ""
                  try {
                      val dir = getExternalFilesDir(null) ?: error("External app-specific directory is unavailable")
                      val fixture = File(dir, "ASL_OWNER_EXTERNAL_FIXTURE.txt")
                      fixture.writeText("ASL_STAGE3_OWNER_FIXTURE")
                      val content = fixture.readText()
                      observed = if (content == "ASL_STAGE3_OWNER_FIXTURE") "ALLOW" else "INCORRECT_DATA"
                      detail = "Read own app-specific external file via getExternalFilesDir"
                  } catch (e: Exception) {
                      detail = "${e.javaClass.simpleName}: ${e.message}"
                  }
                  val passed = observed == expected
                  val result = JSONObject()
                      .put("id", "F1").put("expected", expected)
                      .put("observed", observed).put("pass", passed)
                      .put("detail", detail)
                  Log.i("SecurityLab", "ASL_STORAGE_RESULT:$result")
                  setContentView(TextView(this).apply {
                      text = "Storage F1: $observed"
                      textSize = 23f
                  })
              }
          }
          STAGE3_OWNERSTORAGEPROBEACTIVITY_KT
          write_managed "client/src/main/java/org/example/securitylab/client/StorageProbeActivity.kt" 'Managed by project-update.yml' <<'STAGE3_CLIENTSTORAGEPROBEACTIVITY_KT'
          // Managed by project-update.yml - Stage 3
          package org.example.securitylab.client
