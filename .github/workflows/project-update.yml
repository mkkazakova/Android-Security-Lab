name: Android Security Lab - Update Project (Stage 4)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-security-project-update
  cancel-in-progress: false

jobs:
  update-project:
    name: Add Android Keystore experiments K1-K3
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Generate Stage 4 files without modifying other workflows
        shell: bash
        run: |
          set -euo pipefail

          # Detect a truncated paste BEFORE creating anything.
          python3 - <<'STAGE4_PREFLIGHT_PY'
          from pathlib import Path
          workflow = Path('.github/workflows/project-update.yml').read_text(encoding='utf-8')
          required = (
              'STAGE4_OWNER_KT', 'STAGE4_CLIENT_KT',
              'STAGE4_KEYSTORE_PY', 'STAGE4_RUN_STAGE4_SH',
              'STAGE4_RUN_TESTS_SH', 'STAGE4_DOC_MD',
              'STAGE4_CATALOG_PY', 'STAGE4_MANIFEST_PY',
              'Verify Stage 4 commit',
          )
          missing = [x for x in required if workflow.count(x) < 2 and x != 'Verify Stage 4 commit']
          if 'Verify Stage 4 commit' not in workflow or missing or len(workflow) < 12000:
              raise SystemExit(f'Incomplete Stage 4 workflow. Missing: {missing}; length={len(workflow)}')
          print('Stage 4 workflow completeness: OK')
          STAGE4_PREFLIGHT_PY

          for source in \
              owner/src/main/AndroidManifest.xml \
              client/src/main/AndroidManifest.xml \
              scripts/run-stage3.sh \
              scripts/run-tests.sh \
              scripts/publish-results.py \
              experiments/catalog.json; do
            test -s "$source" || { echo "Missing Stage 3 dependency: $source" >&2; exit 1; }
          done

          write_managed() {
            local dest="$1" marker="$2" temp
            temp="$(mktemp)"
            cat > "$temp"
            if [ -f "$dest" ] && ! grep -Fq "$marker" "$dest"; then
              echo "Refusing to overwrite unmanaged file: $dest" >&2
              rm -f "$temp"
              return 1
            fi
            mkdir -p "$(dirname "$dest")"
            if [ -f "$dest" ] && cmp -s "$dest" "$temp"; then
              echo "Unchanged: $dest"
              rm -f "$temp"
            else
              mv "$temp" "$dest"
              echo "Updated: $dest"
            fi
          }

          write_managed "owner/src/main/java/org/example/securitylab/owner/KeystoreProbeActivity.kt" 'Managed by project-update.yml' <<'STAGE4_OWNER_KT'
          // Managed by project-update.yml - Stage 4 Android Keystore
          package org.example.securitylab.owner

          import android.app.Activity
          import android.os.Bundle
          import android.security.keystore.KeyGenParameterSpec
          import android.security.keystore.KeyInfo
          import android.security.keystore.KeyProperties
          import android.util.Log
          import android.widget.TextView
          import org.json.JSONObject
          import java.security.KeyStore
          import javax.crypto.Cipher
          import javax.crypto.KeyGenerator
          import javax.crypto.SecretKey
          import javax.crypto.SecretKeyFactory
          import javax.crypto.spec.GCMParameterSpec

          class KeystoreProbeActivity : Activity() {
              private val alias = "asl_stage4_owner_aes"
              private val sample = "ASL_STAGE4_K1_AES_GCM_PAYLOAD"

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val scenario = intent.getStringExtra("experiment_id") ?: "UNKNOWN"
                  var observed = "ERROR"
                  var detail = ""
                  var securityLevel: String? = null
                  val expected = if (scenario == "K2") "DENY" else "ALLOW"

                  try {
                      val store = KeyStore.getInstance("AndroidKeyStore").apply { load(null) }
                      when (scenario) {
                          "K1" -> {
                              if (!store.containsAlias(alias)) {
                                  val generator = KeyGenerator.getInstance(
                                      KeyProperties.KEY_ALGORITHM_AES, "AndroidKeyStore"
                                  )
                                  val spec = KeyGenParameterSpec.Builder(
                                      alias,
                                      KeyProperties.PURPOSE_ENCRYPT or KeyProperties.PURPOSE_DECRYPT
                                  )
                                      .setBlockModes(KeyProperties.BLOCK_MODE_GCM)
                                      .setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE)
                                      .setKeySize(256)
                                      .build()
                                  generator.init(spec)
                                  generator.generateKey()
                              }
                              val key = store.getKey(alias, null) as? SecretKey
                                  ?: error("Owner key missing after generation")
                              val encrypt = Cipher.getInstance("AES/GCM/NoPadding")
                              encrypt.init(Cipher.ENCRYPT_MODE, key)
                              val ciphertext = encrypt.doFinal(sample.toByteArray(Charsets.UTF_8))
                              val iv = encrypt.iv ?: error("GCM IV unavailable")
                              val decrypt = Cipher.getInstance("AES/GCM/NoPadding")
                              decrypt.init(Cipher.DECRYPT_MODE, key, GCMParameterSpec(128, iv))
                              val plaintext = decrypt.doFinal(ciphertext).toString(Charsets.UTF_8)
                              observed = if (plaintext == sample && iv.isNotEmpty()) "ALLOW" else "INCORRECT_DATA"
                              detail = "AES-256/GCM encrypt-decrypt round-trip; ciphertext and IV generated in app"
                          }
                          "K2" -> {
                              val key = store.getKey(alias, null) as? SecretKey
                                  ?: error("Owner key missing; K1 must run first")
                              val encoded = key.encoded
                              observed = if (encoded == null) "DENY" else "ALLOW"
                              detail = "SecretKey.getEncoded()=" +
                                  (if (encoded == null) "null" else "non-null") +
                                  "; export via JCA denied only when null"
                              try {
                                  val factory = SecretKeyFactory.getInstance("AES", "AndroidKeyStore")
                                  val info = factory.getKeySpec(key, KeyInfo::class.java) as KeyInfo
                                  securityLevel = "KeyInfo.securityLevel=" + info.securityLevel
                                  detail += "; " + securityLevel
                              } catch (e: Exception) {
                                  detail += "; security level not established: " + e.javaClass.simpleName
                              }
                          }
                          "K3_CONTROL" -> {
                              val key = store.getKey(alias, null) as? SecretKey
                              observed = if (store.containsAlias(alias) && key != null) "ALLOW" else "DENY"
                              detail = "Owner can still resolve original alias after cross-app negative test"
                          }
                          else -> detail = "Unknown experiment ID"
                      }
                  } catch (e: Exception) {
                      detail = "${e.javaClass.simpleName}: ${e.message}"
                  }

                  val result = JSONObject()
                      .put("id", scenario)
                      .put("expected", expected)
                      .put("observed", observed)
                      .put("pass", observed == expected)
                      .put("detail", detail)
                  if (securityLevel != null) result.put("security_level", securityLevel)
                  Log.i("SecurityLab", "ASL_KEYSTORE_RESULT:$result")
                  setContentView(TextView(this).apply {
                      text = "Keystore $scenario: $observed"
                      textSize = 23f
                      setPadding(24, 42, 20, 20)
                  })
              }
          }
          STAGE4_OWNER_KT

          write_managed "client/src/main/java/org/example/securitylab/client/KeystoreProbeActivity.kt" 'Managed by project-update.yml' <<'STAGE4_CLIENT_KT'
          // Managed by project-update.yml - Stage 4 Android Keystore
          package org.example.securitylab.client

          import android.app.Activity
          import android.os.Bundle
          import android.util.Log
          import android.widget.TextView
          import org.json.JSONObject
          import java.security.KeyStore

          class KeystoreProbeActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val alias = "asl_stage4_owner_aes"
                  var observed = "ERROR"
                  var detail = ""
                  try {
                      val store = KeyStore.getInstance("AndroidKeyStore").apply { load(null) }
                      val isVisible = store.containsAlias(alias)
                      val retrieved = store.getKey(alias, null)
                      observed = if (!isVisible && retrieved == null) "DENY" else "ALLOW"
                      detail = "Client UID: alias visible=$isVisible, key accessible=${retrieved != null}"
                  } catch (e: Exception) {
                      detail = "${e.javaClass.simpleName}: ${e.message}"
                  }
                  val result = JSONObject()
                      .put("id", "K3")
                      .put("expected", "DENY")
                      .put("observed", observed)
                      .put("pass", observed == "DENY")
                      .put("detail", detail)
                  Log.i("SecurityLab", "ASL_KEYSTORE_RESULT:$result")
                  setContentView(TextView(this).apply {
                      text = "Keystore K3: $observed"
                      textSize = 23f
                      setPadding(24, 42, 20, 20)
                  })
              }
          }
          STAGE4_CLIENT_KT

          write_managed "scripts/keystore-tests.py" 'Managed by project-update.yml' <<'STAGE4_KEYSTORE_PY'
          # Managed by project-update.yml - Stage 4 Android Keystore
          """K1-K3: app-observed Android Keystore experiments with an owner control."""
          import json
          import subprocess
          import sys
          import time
          from pathlib import Path

          OWNER = 'org.example.securitylab.owner'
          CLIENT = 'org.example.securitylab.client'
          MARKER = 'ASL_KEYSTORE_RESULT:'
          API = subprocess.check_output(
              ['adb', 'shell', 'getprop', 'ro.build.version.sdk'], text=True
          ).strip()
          OUT = Path('results') / f'stage1-api-{API}'
          REPORT = OUT / 'report.json'
          report = json.loads(REPORT.read_text(encoding='utf-8'))
          records = []
          evidence = []


          def adb(*args, timeout=35):
              cmd = ['adb', *args]
              result = subprocess.run(cmd, capture_output=True, text=True, timeout=timeout)
              if result.returncode:
                  raise RuntimeError(
                      f'{" ".join(cmd)}: {result.stderr.strip() or result.stdout.strip()}'
                  )
              return result.stdout


          def collect_record(test_id, seconds=20):
              deadline = time.monotonic() + seconds
              last = ''
              while time.monotonic() < deadline:
                  last = adb('logcat', '-d', '-v', 'raw', '-s', 'SecurityLab:I', '*:S')
                  for line in reversed(last.splitlines()):
                      if MARKER not in line:
                          continue
                      try:
                          record = json.loads(line.split(MARKER, 1)[1])
                      except json.JSONDecodeError:
                          continue
                      if record.get('id') == test_id:
                          evidence.append(f'{test_id}\n{last}\n')
                          return record
                  time.sleep(0.5)
              evidence.append(f'{test_id}: timeout\n{last}\n')
              raise RuntimeError(f'No app-side result for {test_id}')


          def run(test_id, package, expected):
              try:
                  adb('shell', 'am', 'force-stop', package)
                  adb('logcat', '-c')
                  adb(
                      'shell', 'am', 'start', '-W', '-n', f'{package}/.KeystoreProbeActivity',
                      '--es', 'experiment_id', test_id
                  )
                  record = collect_record(test_id)
                  if record.get('expected') != expected or record.get('observed') != expected:
                      record['pass'] = False
                  if record.get('pass') is not True:
                      record['pass'] = False
                  return record
              except Exception as exc:
                  return {
                      'id': test_id,
                      'expected': expected,
                      'observed': 'ERROR',
                      'pass': False,
                      'detail': str(exc)[:450],
                  }


          def print_record(record):
              print(json.dumps(record, ensure_ascii=False), flush=True)


          try:
              k1 = run('K1', OWNER, 'ALLOW')
              records.append(k1)
              print_record(k1)

              if k1['pass']:
                  k2 = run('K2', OWNER, 'DENY')
              else:
                  k2 = {
                      'id': 'K2', 'expected': 'DENY', 'observed': 'ERROR',
                      'pass': False, 'detail': 'K1 positive control failed',
                  }
              records.append(k2)
              print_record(k2)

              if k1['pass']:
                  k3 = run('K3', CLIENT, 'DENY')
                  control = run('K3_CONTROL', OWNER, 'ALLOW')
                  evidence.append('K3_OWNER_CONTROL ' + json.dumps(control, ensure_ascii=False))
                  if not control.get('pass'):
                      k3['pass'] = False
                      k3['detail'] = str(k3.get('detail', '')) + \
                          '; owner alias positive control failed: ' + str(control.get('detail', ''))
                  else:
                      k3['detail'] = str(k3.get('detail', '')) + \
                          '; owner alias remains accessible (positive control)'
              else:
                  k3 = {
                      'id': 'K3', 'expected': 'DENY', 'observed': 'ERROR',
                      'pass': False, 'detail': 'Owner alias not verified by K1',
                  }
              records.append(k3)
              print_record(k3)
          finally:
              OUT.mkdir(parents=True, exist_ok=True)
              (OUT / 'keystore-logcat.txt').write_text(
                  '\n\n'.join(evidence) + '\n', encoding='utf-8'
              )

          report['stage'] = 'sandbox_ipc_permissions_storage_keystore'
          report['results'].extend(records)
          expected_ids = {
              *(f'S{i}' for i in range(1, 6)),
              *(f'P{i}' for i in range(1, 4)),
              *(f'F{i}' for i in range(1, 4)),
              *(f'K{i}' for i in range(1, 4)),
          }
          seen_ids = {x.get('id') for x in report['results'] if isinstance(x, dict)}
          report['status'] = (
              'PASS' if expected_ids.issubset(seen_ids)
              and len(seen_ids & expected_ids) == len(expected_ids)
              and all(x.get('pass') is True for x in report['results'])
              else 'FAIL'
          )
          REPORT.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False, indent=2), flush=True)
          if report['status'] != 'PASS':
              sys.exit('Android Keystore experiment failed; inspect K1-K3 and keystore-logcat.txt')
          STAGE4_KEYSTORE_PY

          write_managed "scripts/run-stage4.sh" 'Managed by project-update.yml' <<'STAGE4_RUN_STAGE4_SH'
          #!/usr/bin/env bash
          # Managed by project-update.yml - Stage 4
          set -euo pipefail
          bash scripts/run-stage3.sh
          python3 scripts/keystore-tests.py
          STAGE4_RUN_STAGE4_SH

          write_managed "scripts/run-tests.sh" 'Managed by project-update.yml' <<'STAGE4_RUN_TESTS_SH'
          #!/usr/bin/env bash
          # Managed by project-update.yml - current full test suite
          set -euo pipefail
          bash scripts/run-stage4.sh
          STAGE4_RUN_TESTS_SH

          write_managed "experiments/keystore.md" 'Managed by project-update.yml' <<'STAGE4_DOC_MD'
          <!-- Managed by project-update.yml - Stage 4 Android Keystore -->
          # Android Keystore: методика K1–K3

          Объект: два разных приложения (`SecurityOwner` и `SecurityClient`) с различными UID в Android Emulator API 33 и API 36. Во всех испытаниях `targetSdk = 33`.

          | ID | Метод | Ожидаемое наблюдение |
          |---|---|---|
          | K1 | Owner создаёт ключ AES-256 через `AndroidKeyStore` и выполняет AES/GCM/NoPadding encrypt/decrypt | ALLOW: восстановлен исходный текст |
          | K2 | Owner вызывает `SecretKey.getEncoded()` для ключа K1 | DENY: API возвращает `null`, байты ключа не выдаются |
          | K3 | Client с другим UID ищет алиас ключа Owner в собственном `AndroidKeyStore` | DENY: алиас отсутствует, `getKey` возвращает `null` |

          Для K3 дополнительно повторно проверяется наличие исходного ключа в Owner: это положительный контроль, исключающий ложноуспешный запрет из-за удаления ключа.

          Результат собирается из Logcat самого Android-приложения с меткой `ASL_KEYSTORE_RESULT`, а не по выводу внешней утилиты. Исключения и отсутствие ответа фиксируются как `ERROR` и никогда не считаются подтверждением защиты.

          K2 проверяет невозможность извлечь байты через стандартный JCA API, а не математическую неуязвимость ключа ко всем атакам. `KeyInfo.securityLevel`, когда доступен, сохраняется как диагностический признак. Результаты Android Emulator не являются подтверждением аппаратной защиты TEE/StrongBox.

          Источники: https://developer.android.com/privacy-and-security/keystore ; https://developer.android.com/reference/android/security/keystore/KeyGenParameterSpec ; https://developer.android.com/reference/android/security/keystore/KeyInfo
          STAGE4_DOC_MD

          python3 - <<'STAGE4_CATALOG_PY'
          import json
          from pathlib import Path
          p = Path('experiments/catalog.json')
          doc = json.loads(p.read_text(encoding='utf-8'))
          if doc.get('managed_by') != 'project-update.yml':
              raise SystemExit('Refusing to edit unrecognized experiments/catalog.json')
          entries = doc.get('experiments')
          if not isinstance(entries, list):
              raise SystemExit('Malformed experiment catalog')
          current = {x.get('id') for x in entries}
          original = {f'S{i}' for i in range(1, 6)} | {f'P{i}' for i in range(1, 4)} | {f'F{i}' for i in range(1, 4)}
          if not original.issubset(current):
              raise SystemExit(f'Stage 3 catalog incomplete: {sorted(original - current)}')
          for test in (
              {'id': 'K1', 'title': 'Android Keystore: шифрование и расшифрование AES-GCM'},
              {'id': 'K2', 'title': 'Android Keystore: отказ в экспорте байтов секретного ключа'},
              {'id': 'K3', 'title': 'Android Keystore: изоляция ключа между приложениями'},
          ):
              if test['id'] not in current:
                  entries.append(test)
          if len({x['id'] for x in entries}) != len(entries):
              raise SystemExit('Duplicate experiment IDs detected')
          new = json.dumps(doc, ensure_ascii=False, indent=2) + '\n'
          if p.read_text(encoding='utf-8') != new:
              p.write_text(new, encoding='utf-8')
              print('Updated:', p)
          else:
              print('Unchanged:', p)
          STAGE4_CATALOG_PY

          python3 - <<'STAGE4_MANIFEST_PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          for module in ('owner', 'client'):
              p = Path(module) / 'src/main/AndroidManifest.xml'
              xml = p.read_text(encoding='utf-8')
              activity = '.KeystoreProbeActivity'
              if f'android:name="{activity}"' not in xml:
                  if xml.count('</application>') != 1:
                      raise SystemExit(f'Unexpected XML structure in {p}')
                  xml = xml.replace(
                      '</application>',
                      '        <activity android:name=".KeystoreProbeActivity" android:exported="true" />\n    </application>',
                      1,
                  )
                  p.write_text(xml, encoding='utf-8')
                  print('Updated:', p)
              ET.parse(p)
              root = ET.parse(p).getroot()
              ns = '{http://schemas.android.com/apk/res/android}'
              found = [x for x in root.iter('activity') if x.get(ns + 'name') == activity]
              if len(found) != 1:
                  raise SystemExit(f'KeystoreProbeActivity declaration invalid in {p}')
              print('Manifest OK:', p)
          STAGE4_MANIFEST_PY

          python3 -m py_compile scripts/keystore-tests.py scripts/storage-tests.py scripts/publish-results.py
          bash -n scripts/run-tests.sh scripts/run-stage4.sh scripts/run-stage3.sh
          python3 - <<'STAGE4_VERIFY_PY'
          import json
          from pathlib import Path
          required = [
              'owner/src/main/java/org/example/securitylab/owner/KeystoreProbeActivity.kt',
              'client/src/main/java/org/example/securitylab/client/KeystoreProbeActivity.kt',
              'scripts/keystore-tests.py', 'scripts/run-stage4.sh',
              'scripts/run-tests.sh', 'experiments/keystore.md',
          ]
          for filename in required:
              if not Path(filename).is_file() or Path(filename).stat().st_size < 60:
                  raise SystemExit(f'Missing or truncated Stage 4 file: {filename}')
          with open('experiments/catalog.json', encoding='utf-8') as source:
              catalog = json.load(source)
          ids = [item['id'] for item in catalog['experiments']]
          expected = [*(f'S{i}' for i in range(1, 6)), *(f'P{i}' for i in range(1, 4)),
                      *(f'F{i}' for i in range(1, 4)), *(f'K{i}' for i in range(1, 4))]
          if ids != expected:
              raise SystemExit(f'Unexpected catalog entries: {ids}')
          if 'bash scripts/run-stage4.sh' not in Path('scripts/run-tests.sh').read_text():
              raise SystemExit('run-tests.sh is not connected to Stage 4')
          print('Stage 4 generator: all 14 scenario IDs present and source files validated.')
          STAGE4_VERIFY_PY

      - name: Commit Stage 4 source, scripts and documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- owner/src/main/AndroidManifest.xml client/src/main/AndroidManifest.xml
          git add -- owner/src/main/java/org/example/securitylab/owner/KeystoreProbeActivity.kt
          git add -- client/src/main/java/org/example/securitylab/client/KeystoreProbeActivity.kt
          git add -- scripts/keystore-tests.py scripts/run-stage4.sh scripts/run-tests.sh
          git add -- experiments/catalog.json experiments/keystore.md
          if git diff --cached --quiet; then
            echo "Stage 4 is already up to date."
          else
            git commit -m "feat: Android Keystore experiments K1-K3 [skip ci]"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi

      - name: Verify Stage 4 commit
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            scripts/keystore-tests.py \
            scripts/run-stage4.sh \
            scripts/run-tests.sh \
            experiments/catalog.json \
            experiments/keystore.md; do
            git cat-file -e "HEAD:$path" || { echo "Not committed: $path" >&2; exit 1; }
          done
          echo "Stage 4 commit verified: all required files exist in HEAD."
