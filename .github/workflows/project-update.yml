          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- owner/src/main/AndroidManifest.xml client/src/main/AndroidManifest.xml
          git add -- owner/src/main/java/org/example/securitylab/owner/StorageProbeActivity.kt
          git add -- client/src/main/java/org/example/securitylab/client/StorageProbeActivity.kt
          git add -- scripts/storage-tests.py scripts/run-stage3.sh scripts/run-tests.sh scripts/publish-results.py
          git add -- experiments/catalog.json experiments/storage.md
          if git diff --cached --quiet; then
            echo 'Stage 3 files already current.'
          else
            git commit -m 'feat: add Scoped Storage scenarios F1-F3 [skip ci]'
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi
