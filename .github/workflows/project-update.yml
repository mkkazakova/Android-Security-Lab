name: Android Security Lab - Final Documentation Update

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-security-project-update
  cancel-in-progress: false

jobs:
  update-project:
    name: Document all 14 completed experiments
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Validate complete workflow before making changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'ASL_FINAL_PREFLIGHT'
          from pathlib import Path
          workflow=Path('.github/workflows/project-update.yml').read_text(encoding='utf-8')
          for marker in ('ASL_FINAL_DOCS_GENERATOR', 'ASL_FINAL_DOCS_END',
                         'Validate generated documentation', 'Commit documentation and publisher'):
              if marker not in workflow:
                  raise SystemExit(f'Incomplete workflow paste: missing {marker}')
          if len(workflow)<16000:
              raise SystemExit('Workflow file looks truncated')
          print('Final documentation workflow completeness: OK')
          ASL_FINAL_PREFLIGHT

      - name: Generate experiment instructions from verified reports
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'ASL_FINAL_DOCS_GENERATOR'
          # Final documentation updater for Android-Security-Lab.
          # Never alters Kotlin, Bash test launchers, or previously measured JSON data.
          from pathlib import Path
          import json
          import re
          from textwrap import dedent
          
          ROOT = Path('.')
          README = Path('README.md')
          RESULTS = Path('results')
          SHOT = Path('docs/screenshots')
          SCRIPT = Path('scripts/publish-results.py')
          EXPECTED = ['S1','S2','S3','S4','S5','P1','P2','P3','F1','F2','F3','K1','K2','K3']
          
          # Source data must exist and match the successful, already verified run.
          reports = {}
          for api in (33, 36):
              file = RESULTS / f'latest-api-{api}.json'
              if not file.is_file():
                  raise SystemExit(f'Missing required measured report: {file}')
              data = json.loads(file.read_text(encoding='utf-8'))
              entries = data.get('results', [])
              ids = [x.get('id') for x in entries if isinstance(x, dict)]
              if (int(data.get('api', -1)) != api or data.get('status') != 'PASS'
                      or ids != EXPECTED or int(data.get('target_sdk', -1)) != 33):
                  raise SystemExit(f'Unexpected or incomplete report: {file}')
              if not all(x.get('pass') is True and x.get('observed') == x.get('expected') for x in entries):
                  raise SystemExit(f'Inconsistent individual outcomes: {file}')
              reports[api] = {x['id']: x for x in entries}
          summary_file = RESULTS / 'summary.json'
          if not summary_file.is_file():
              raise SystemExit('Missing results/summary.json')
          summary = json.loads(summary_file.read_text(encoding='utf-8'))
          if (summary.get('api_33') != 'PASS' or summary.get('api_36') != 'PASS'
                  or summary.get('expected_scenarios') != EXPECTED):
              raise SystemExit('summary.json disagrees with the complete 14-scenario report')
          if not README.is_file() or not SCRIPT.is_file():
              raise SystemExit('README.md or scripts/publish-results.py not found')
          
          # These paths are used only for images that already exist in the repository.
          def img(filename, alt, width=210):
              p=SHOT / filename
              if not p.is_file():
                  print(f'No image, omitting broken README link: {p}')
                  return ''
              return f'<img src="{p.as_posix()}" alt="{alt}" width="{width}">'
          
          def table_images(rows):
              result=['| Материал | Android 13 | Android 16 |','|---|---|---|']
              for name,a,b in rows:
                  result.append(f'| {name} | {a or "Нет файла"} | {b or "Нет файла"} |')
              return '\n'.join(result)
          
          scenarios = [
           ('S1','Чтение собственного приватного файла','Изоляция приложений',
            'Создать приватный файл средствами SecurityOwner и прочитать его от имени этого же приложения.',
            'Приложение-владелец успешно считывает записанные тестовые данные.',
            'ALLOW'),
           ('S2','Попытка чтения чужого приватного файла','Изоляция приложений',
            'Сохранить приватный файл в SecurityOwner; из SecurityClient с другим UID попытаться открыть его по прямому пути. Отдельно убедиться, что файл действительно существует.',
            'Android отклоняет прямой доступ. Зарегистрировано FileNotFoundException, наличие файла подтверждено проверкой исходных данных.',
            'DENY'),
           ('S3','Доступ к закрытому ContentProvider','Межприложенное взаимодействие',
            'SecurityClient выполняет запрос к ContentProvider SecurityOwner, который закрыт для других приложений.',
            'Запрос отклоняется системой с SecurityException.',
            'DENY'),
           ('S4','Доступ к открытому ContentProvider','Межприложенное взаимодействие',
            'SecurityClient обращается к намеренно открытому тестовому ContentProvider приложения SecurityOwner.',
            'Запрос разрешён, возвращено ожидаемое тестовое содержимое.',
            'ALLOW'),
           ('S5','ContentProvider с проверкой разрешения','Межприложенное взаимодействие',
            'SecurityClient запрашивает данные ContentProvider, для которого установлено ограничение по разрешению, отсутствующему у клиента.',
            'Система отклоняет запрос с SecurityException.',
            'DENY'),
           ('P1','Камера: разрешение не выдано','Runtime Permissions',
            'Через ADB отозвать разрешение CAMERA, затем запустить PermissionProbeActivity в SecurityClient и вызвать checkSelfPermission.',
            'Приложение видит отсутствие разрешения CAMERA.',
            'DENY'),
           ('P2','Камера: разрешение выдано','Runtime Permissions',
            'Через ADB предоставить CAMERA тому же приложению и повторно проверить состояние через checkSelfPermission.',
            'Приложение фиксирует наличие разрешения CAMERA.',
            'ALLOW'),
           ('P3','Камера: разрешение отозвано','Runtime Permissions',
            'После P2 отозвать CAMERA через ADB, заново запустить Activity и проверить разрешение.',
            'Приложение фиксирует отсутствие ранее предоставленного разрешения.',
            'DENY'),
           ('F1','Чтение собственного файла во внешнем хранилище','Scoped Storage',
            'Создать файл в собственной app-specific директории внешнего хранилища с помощью getExternalFilesDir и прочитать его тем же приложением.',
            'Чтение собственных данных разрешено.',
            'ALLOW'),
           ('F2','Прямой доступ к файлу другого приложения','Scoped Storage',
            'SecurityClient пытается напрямую открыть app-specific файл SecurityOwner. Убедиться, что тестовый файл создан и доступен владельцу.',
            'Прямой доступ отклонён; в журнале зарегистрировано FileNotFoundException.',
            'DENY'),
           ('F3','Чтение документа через системный выбор файла','Scoped Storage и Storage Access Framework',
            'Разместить тестовый документ в Downloads, вызвать из SecurityClient ACTION_OPEN_DOCUMENT, выбрать документ через системный интерфейс и прочитать возвращённый URI через ContentResolver.',
            'После выбора документа приложение получает URI и успешно читает содержимое.',
            'ALLOW'),
           ('K1','Шифрование и расшифрование с Android Keystore','Android Keystore',
            'Создать ключ AES-256 в Android Keystore, зашифровать тестовую строку в режиме GCM, затем расшифровать и сравнить исходные байты.',
            'Шифрование и последующее расшифрование выполнены успешно; получены шифртекст и IV.',
            'ALLOW'),
           ('K2','Попытка извлечения секретного ключа','Android Keystore',
            'Для созданного ключа вызвать SecretKey.getEncoded() и проверить KeyInfo.securityLevel.',
            'getEncoded() возвращает null; экспорт ключа через этот API недоступен. В эмуляторе securityLevel=0 (программная защита).',
            'DENY'),
           ('K3','Межприложенная изоляция ключа','Android Keystore',
            'В SecurityClient попробовать найти и использовать псевдоним ключа, созданного SecurityOwner; отдельно проверить доступ со стороны владельца.',
            'Ключ недоступен клиенту, но доступен владельцу (положительный контроль).',
            'DENY'),
          ]
          
          heading = {
           'S':'Изоляция приложений и IPC — S1–S5',
           'P':'Управление разрешениями — P1–P3',
           'F':'Доступ к файлам — F1–F3',
           'K':'Android Keystore — K1–K3',
          }
          
          intro=dedent('''
          <!-- ASL_GUIDE_START -->
          ## Что находится в репозитории
          
          Здесь приведены **инструкции и фактические результаты** 14 проверок встроенных механизмов безопасности Android. Это рабочая документация экспериментов, а не текст курсового отчёта.
          
          Для испытаний используются два независимых приложения — **SecurityOwner** (создаёт тестовые ресурсы) и **SecurityClient** (проверяет доступ к ним). Приложения не выполняют атаки с root-доступом. Все данные синтетические.
          
          ### Условия проведения
          
          | Параметр | Значение |
          |---|---|
          | Операционная система | Android 13 и Android 16 |
          | API Level | 33 и 36 соответственно |
          | `targetSdk` обоих приложений | 33 |
          | Испытательная среда | Android Emulator, два приложения с разными UID |
          | Инструменты | ADB, скрипты в `scripts/`, GitHub Actions |
          | Зафиксированный успешный прогон | [5 ноября 2026 года](https://github.com/mkkazakova/Android-Security-Lab/actions/runs/42021014242) |
          | Машиночитаемые данные | [`results/latest-api-33.json`](results/latest-api-33.json), [`results/latest-api-36.json`](results/latest-api-36.json), [`results/summary.json`](results/summary.json) |
          
          Сравнивается поведение **одних и тех же приложений с targetSdk 33** в двух версиях Android. Эти результаты не позволяют оценить все возможные конфигурации Android или аппаратные свойства конкретного смартфона.
          
          ### Как повторить испытания
          
          1. Перейти в репозитории в **Actions → Android Security Lab - Complete Experiments**.
          2. Выбрать ветку `master` и нажать **Run workflow**.
          3. Дождаться выполнения проверок API 33 и API 36, затем задания публикации результатов.
          4. Проверить `results/latest-api-33.json`, `results/latest-api-36.json` и `results/summary.json`. У каждого сценария должны присутствовать `expected`, `observed` и `pass`.
          5. При необходимости получить полные журналы и дополнительные изображения из **Artifacts** соответствующего запуска GitHub Actions.
          
          Основной сценарий запуска — `scripts/run-tests.sh`. Скрипты `run-stage1.sh`–`run-stage4.sh` и отдельные Python-модули выполняют последовательные группы проверок. Реальные операции с ресурсами выполняются внутри Android-приложений.
          
          **Интерпретация:** `PASS` означает совпадение наблюдения с ожидаемым поведением. `DENY` при тестировании запрета доступа является успешным результатом. Ошибка автоматизации (`ERROR`) сама по себе не подтверждает механизм защиты.
          
          ## Проведённые эксперименты
          ''').strip()
          lines=[intro]
          current_group=None
          for sid,title,group,procedure,observed,expected in scenarios:
              if sid[0]!=current_group:
                  current_group=sid[0]
                  lines.extend(['',f'### {heading[current_group]}',''])
              detail_a = reports[33][sid]
              detail_b = reports[36][sid]
              if detail_a['observed'] != expected or detail_b['observed'] != expected:
                  raise SystemExit(f'Unexpected report observation for {sid}')
              lines.extend([
                 f'#### {sid}. {title}',
                 f'**Что проверяли:** {group.lower()}.',
                 f'**Порядок действий:** {procedure}',
                 f'**Ожидаемый результат:** `{expected}`.',
                 f'**Наблюдение:** {observed}',
                 f'**Итог:** Android 13 — **PASS ({detail_a["observed"]})**; Android 16 — **PASS ({detail_b["observed"]})**.',
                 f'**Подтверждение:** запись `{sid}` в JSON-отчётах [API 33](results/latest-api-33.json) и [API 36](results/latest-api-36.json).',
                 ''
              ])
              if sid=='S5':
                  lines.extend([
                      '**Скриншоты приложений при испытаниях Sandbox и IPC:**',
                      table_images([
                          ('SecurityOwner', img('stage1-android-13-owner.png','SecurityOwner на Android 13'), img('stage1-android-16-owner.png','SecurityOwner на Android 16')),
                          ('SecurityClient', img('stage1-android-13-client.png','SecurityClient на Android 13'), img('stage1-android-16-client.png','SecurityClient на Android 16')),
                      ]),
                      '',
                      '*Эти изображения показывают тестовые приложения. Доказательство разрешения или запрета доступа — результаты операций в JSON и журналах.*',
                      ''
                  ])
              if sid=='P3':
                  lines.extend(['*Разрешение выдаётся и отзывается ADB только для подготовки теста. Фактическое состояние проверяется приложением; работа физической камеры не испытывается.*',''])
              if sid=='F3':
                  lines.extend([
                      '**Скриншоты из испытаний файлового доступа:**',
                      table_images([
                          ('SecurityOwner', img('stage3-api-33-owner.png','Owner, API 33'), img('stage3-api-36-owner.png','Owner, API 36')),
                          ('SecurityClient', img('stage3-api-33-client.png','Client, API 33'), img('stage3-api-36-client.png','Client, API 36')),
                          ('Системный выбор документа F3', img('stage3-api-33-f3-picker.png','Выбор документа F3, API 33'), img('stage3-api-36-f3-picker.png','Выбор документа F3, API 36')),
                      ]),
                      '',
                      '*F3 фиксирует работу системного выбора документа и доступ после выдачи URI, а не обход защиты файлового хранилища.*',
                      ''
                  ])
              if sid=='K3':
                  lines.extend(['*Ограничение K1–K3:* `KeyInfo.securityLevel=0` в обоих эмуляторах означает программный уровень защиты. Аппаратные TEE и StrongBox в этих испытаниях не проверялись.',''])
          
          lines += [
              '## Сравнение результатов',
              '',
              'В обоих эмуляторах все **14 сценариев завершились успешно** (всего **28 PASS**). В пределах этих конкретных сценариев различий между Android 13 и Android 16 не обнаружено. Это не означает отсутствия изменений в безопасности между версиями Android в целом.',
              '',
              'Сводная таблица ниже обновляется при каждом успешном запуске испытаний. Она содержит результаты последнего подтверждённого прогона и ссылку на GitHub Actions.',
              '',
              '<!-- ASL_GUIDE_END -->'
          ]
          guide='\n'.join(lines).strip()+'\n'
          
          # Update a dedicated static area; the existing results and emulator readiness blocks remain untouched.
          original=README.read_text(encoding='utf-8')
          start='<!-- ASL_GUIDE_START -->'
          end='<!-- ASL_GUIDE_END -->'
          if (start in original) != (end in original):
              raise SystemExit('README contains broken ASL_GUIDE markers')
          if start in original:
              before, tail=original.split(start,1)
              _, after=tail.split(end,1)
              updated=before.rstrip()+'\n\n'+guide+'\n'+after.lstrip('\n')
          else:
              # Install the guide immediately after the main heading.
              lines_original=original.splitlines(keepends=True)
              if not lines_original or not lines_original[0].lstrip().startswith('# '):
                  raise SystemExit('README.md has an unexpected first heading')
              updated=lines_original[0].rstrip()+'\n\n'+guide+'\n'+''.join(lines_original[1:]).lstrip('\n')
          
          # Keep links to technical docs, remove links to a draft assignment/academic report.
          links_start='<!-- RESEARCH_DOCS_LINKS_START -->'
          links_end='<!-- RESEARCH_DOCS_LINKS_END -->'
          links=dedent('''
          <!-- RESEARCH_DOCS_LINKS_START -->
          ## Файлы и дополнительные инструкции
          
          - [Подробная методика всех 14 проверок](experiments/test-plan.md)
          - [Устройство приложений и системы запуска](docs/architecture.md)
          - [Методика работы с разрешениями](experiments/permissions.md)
          - [Методика проверки файлового доступа](experiments/storage.md)
          - [Методика Android Keystore](experiments/keystore.md)
          - [Результаты в JSON](results/)
          
          <!-- RESEARCH_DOCS_LINKS_END -->
          ''').strip()
          if (links_start in updated) != (links_end in updated):
              raise SystemExit('README contains broken links markers')
          if links_start in updated:
              before,tail=updated.split(links_start,1)
              _,after=tail.split(links_end,1)
              updated=before.rstrip()+'\n\n'+links+'\n'+after.lstrip('\n')
          else:
              updated=updated.rstrip()+'\n\n'+links+'\n'
          
          # Preserve the existing data block; publisher replaces only these markers.
          if updated.count('<!-- ANDROID_STAGE1_START -->')!=1 or updated.count('<!-- ANDROID_STAGE1_END -->')!=1:
              raise SystemExit('Missing or repeated automatic experiment results markers')
          if updated.count('<!-- ANDROID_READINESS_RESULTS_START -->')!=1 or updated.count('<!-- ANDROID_READINESS_RESULTS_END -->')!=1:
              raise SystemExit('Missing or repeated emulator readiness markers')
          
          # Technical documents match actually completed work, without scientific-report boilerplate.
          architecture = dedent('''
          # Структура Android Security Lab
          
          ## Компоненты
          
          - `owner/` — приложение **SecurityOwner**. Создаёт тестовые файлы и ContentProvider, использует Android Keystore, выполняет контрольные операции от своего UID.
          - `client/` — независимое приложение **SecurityClient** с другим UID. Выполняет попытки доступа к чужим данным, проверяет состояние CAMERA и доступ к выбранному через системный интерфейс документу.
          - `scripts/run-stage1.sh` — проверки S1–S5: Sandbox и IPC.
          - `scripts/run-stage2.sh` — дополнительно P1–P3: Runtime Permissions.
          - `scripts/run-stage3.sh` и `scripts/storage-tests.py` — дополнительно F1–F3: Scoped Storage.
          - `scripts/run-stage4.sh` и `scripts/keystore-tests.py` — дополнительно K1–K3: Android Keystore.
          - `scripts/run-tests.sh` — точка входа для полного запуска всех 14 сценариев.
          - `scripts/publish-results.py` — обновляет сохранённые JSON, изображения и сводную таблицу README, не перезаписывая постоянные инструкции.
          - `.github/workflows/android-tests.yml` — сборка двух APK, запуск Android Emulator API 33 и API 36 и публикация результатов.
          - `results/` — сохранённые сводные JSON для каждого API и итоговая сводка.
          - `docs/screenshots/` — сохранённые изображения. Дополнительные логи доступны в Artifacts запуска.
          
          ## Последовательность испытаний
          
          `android-tests.yml` → сборка `owner` и `client` → запуск эмулятора → `scripts/run-tests.sh` → Android-приложения → JSON и скриншоты → `scripts/publish-results.py` → README и `results/`.
          
          ## Условия достоверности
          
          - Тесты выполняются на Android 13 (API 33) и Android 16 (API 36) с `targetSdk=33` для обоих приложений.
          - Доступ проверяется из процессов самих приложений, а не от привилегированного пользователя ADB-shell. ADB используется для подготовки среды, выдачи/отзыва разрешения CAMERA и управления испытаниями.
          - Отказ доступа (`DENY`) является успешным результатом только там, где именно такой отказ ожидался.
          - Эксперименты не проверяют аппаратную защиту смартфона. Для Android Keystore зафиксирован программный уровень `securityLevel=0`.
          
          Подробное описание каждого сценария, порядок действий, ожидаемое поведение и результаты приведены в [README](../README.md).
          ''').strip()+'\n'
          
          tp=['# Методика 14 экспериментов', '',
              'Все сценарии выполнены на Android 13 (API 33) и Android 16 (API 36), при `targetSdk=33`. Последний проверенный успешный прогон содержит 28 результатов PASS.', '',
              '## Как повторить', '',
              'Запустить **Actions → Android Security Lab - Complete Experiments → Run workflow** на ветке `master`. Просмотреть оба задания Android API 33/36 и итоговую публикацию. Результаты — в [`results/`](../results/), журналы — в Artifacts соответствующего запуска.', '',
              '## Сценарии', '',
              '| ID | Проверяемое действие | Ожидаемое наблюдение | API 33 | API 36 |',
              '|---|---|---|---|---|']
          for sid,title,group,procedure,observed,expected in scenarios:
              tp.append(f'| [{sid}](../README.md) | {title} | `{expected}` | PASS | PASS |')
          tp += ['',
              'Конкретная последовательность действий и пояснение каждого результата приведены в **[README](../README.md)**. Тесты P1–P3 используют ADB для подготовки состояния разрешения, но проверяют его внутри приложения. Эксперимент F3 использует `ACTION_OPEN_DOCUMENT`; K2 подтверждает неэкспортируемость ключа через `getEncoded()`, но не наличие аппаратной защиты.', '',
              'Дополнительные методики: [Runtime Permissions](permissions.md), [Scoped Storage](storage.md), [Android Keystore](keystore.md).',
              '']
          testplan='\n'.join(tp)
          
          for file, first in ((Path('docs/architecture.md'),'# Архитектура Android Security Lab'),
                              (Path('experiments/test-plan.md'),'# Методика экспериментального исследования')):
              if not file.is_file():
                  raise SystemExit(f'Expected existing technical document absent: {file}')
              prior=file.read_text(encoding='utf-8')
              if first not in prior and not (prior.startswith('# Структура Android Security Lab') if 'architecture' in file.name else prior.startswith('# Методика 14 экспериментов')):
                  raise SystemExit(f'Unexpected user-edited document, refusing to overwrite: {file}')
          
          # Make publisher refuse incomplete artifact sets BEFORE writing/deleting any old report.
          publisher=SCRIPT.read_text(encoding='utf-8')
          if 'Managed by project-update.yml' not in publisher:
              raise SystemExit('Unexpected existing publisher. Refusing to overwrite.')
          if 'ASL_FINAL_PUBLISH_GUARD' not in publisher:
              guard=dedent('''
              # ASL_FINAL_PUBLISH_GUARD: do not replace successful evidence on an incomplete run.
              for _api in (33, 36):
                  _p = Path('downloaded') / f'securitylab-api-{_api}' / 'report.json'
                  if not _p.is_file():
                      raise SystemExit(f'Missing current test report: {_p}. Keeping last successful snapshot.')
                  _data = json.loads(_p.read_text(encoding='utf-8'))
                  _items = _data.get('results', [])
                  _ids = [r.get('id') for r in _items if isinstance(r, dict)]
                  _expected = [t['id'] for t in TESTS]
                  if (int(_data.get('api', -1)) != _api or _data.get('status') != 'PASS'
                          or _ids != _expected or int(_data.get('target_sdk', -1)) != 33
                          or not all(r.get('pass') is True and r.get('observed') == r.get('expected') for r in _items)):
                      raise SystemExit(f'Incomplete/failed current report for API {_api}. Keeping last successful snapshot.')
          
              ''')
              where='for api, version in ((33, \'13\'), (36, \'16\')):'
              if publisher.count(where)!=1:
                  raise SystemExit('Cannot locate publisher iteration for safe patch.')
              publisher=publisher.replace(where,guard+where,1)
          
              # If screenshot is absent in the newer run, retain its last valid copy.
              old='''                  target.unlink(missing_ok=True)
                            screenshots[(api, kind)] = 'Нет скриншота текущего запуска' '''.rstrip()
              # Search with indentation robustly; otherwise abort, not silently patch a different publisher.
              match=re.search(r'(?m)^([ ]*)target\.unlink\(missing_ok=True\)\n\1screenshots\[\(api, kind\)\] = \'Нет скриншота текущего запуска\'',publisher)
              if not match:
                  raise SystemExit('Cannot locate screenshot cleanup block in publisher')
              indent=match.group(1)
              # Avoid escaped quote issues by using a single-quoted outer f-string and double-quoted HTML attributes.
              replacement = (indent + 'if target.is_file():\n' +
                             indent + '    screenshots[(api, kind)] = (\'<img src="\' + target.as_posix() + \'" width="220" alt="\' + kind + \'" >\')\n' +
                             indent + 'else:\n' +
                             indent + "    screenshots[(api, kind)] = 'Нет сохранённого скриншота'")
              publisher=publisher[:match.start()]+replacement+publisher[match.end():]
          
          # Only now write the staged documents; no running experiments, no modification of actual measured results.
          README.write_text(updated.rstrip()+'\n',encoding='utf-8')
          Path('docs/architecture.md').write_text(architecture,encoding='utf-8')
          Path('experiments/test-plan.md').write_text(testplan,encoding='utf-8')
          SCRIPT.write_text(publisher,encoding='utf-8')
          print('Updated README.md: 14 detailed descriptions and existing evidence blocks preserved')
          print('Updated docs/architecture.md, experiments/test-plan.md')
          print('Updated scripts/publish-results.py: guarded publication and retained old screenshots')
          print('No Android source, test launcher, workflow or results JSON was changed')

          ASL_FINAL_DOCS_GENERATOR

      - name: Validate generated documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/publish-results.py
          python3 - <<'ASL_FINAL_CHECK_PY'
          import json
          from pathlib import Path
          readme=Path('README.md').read_text(encoding='utf-8')
          for start, end in (('<!-- ASL_GUIDE_START -->','<!-- ASL_GUIDE_END -->'),
                             ('<!-- ANDROID_STAGE1_START -->','<!-- ANDROID_STAGE1_END -->'),
                             ('<!-- ANDROID_READINESS_RESULTS_START -->','<!-- ANDROID_READINESS_RESULTS_END -->')):
              if readme.count(start)!=1 or readme.count(end)!=1:
                  raise SystemExit(f'Broken or missing README markers: {start}')
          for label in ('S1','S2','S3','S4','S5','P1','P2','P3','F1','F2','F3','K1','K2','K3'):
              if f'#### {label}.' not in readme:
                  raise SystemExit(f'Missing documentation for {label}')
          if readme.count('**Ожидаемый результат:**')!=14:
              raise SystemExit('Expected exactly 14 scenario descriptions')
          for api in (33, 36):
              report=json.loads(Path(f'results/latest-api-{api}.json').read_text(encoding='utf-8'))
              if report.get('status')!='PASS' or len(report.get('results',[]))!=14:
                  raise SystemExit('Stored report was modified unexpectedly')
          print('Documentation verified: 14 descriptions and two existing successful reports')
          ASL_FINAL_CHECK_PY

      - name: Commit documentation and publisher
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md docs/architecture.md experiments/test-plan.md scripts/publish-results.py
          if git diff --cached --quiet; then
            echo "Final documentation already up to date."
          else
            git commit -m "docs: complete 14 Android security experiment guides [skip ci]"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi

      - name: ASL_FINAL_DOCS_END
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          test -z "$(git status --porcelain)"
          git show --format= --name-only HEAD | head -30
          echo "Final documentation update completed."
