
# Stage 0: one-time documentation bootstrap (does not build Android APKs)
name: Android Security Lab - Initialize research documentation

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-security-documentation-bootstrap
  cancel-in-progress: false

jobs:
  initialize-docs:
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create documentation files without overwriting existing content
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs experiments
          if [ -e "docs/project-plan.md" ]; then
            echo "Skipping existing file: docs/project-plan.md"
          else
            cat > "docs/project-plan.md" <<'ANDROID_SECURITY_DOC_0'
          # План курсовой работы

          **Тема:** «Исследование встроенных механизмов безопасности мобильной ОС Android».

          **Дисциплина:** «Защитные механизмы ОС».

          **Статус:** проект плана, подлежит согласованию с преподавателем.

          ## 1. Цель, объект и предмет исследования

          **Цель:** исследовать встроенные механизмы безопасности Android, разработать воспроизводимый испытательный стенд и экспериментально проверить поведение механизмов изоляции приложений, разрешений, межпроцессного взаимодействия, доступа к файлам и криптографических ключей на Android 13 (API 33) и Android 16 (API 36).

          **Объект:** подсистема обеспечения безопасности мобильной операционной системы Android.

          **Предмет:** механизмы контроля доступа и изоляции непривилегированных приложений Android, а также наблюдаемое поведение этих механизмов при определённых условиях.

          **Исследовательский вопрос:** какие ограничения встроенные механизмы Android накладывают на действия приложений, какие легитимные способы доступа существуют и различается ли наблюдаемое поведение в двух версиях Android при одинаковых конфигурациях приложений?

          ## 2. Задачи

          1. Изучить архитектуру безопасности Android, модель угроз и назначение встроенных механизмов.
          2. Спроектировать стенд на основе двух независимых Android-приложений и автоматизированного запуска в эмуляторе.
          3. Разработать методику из 14 сценариев по пяти группам механизмов (см. `experiments/test-plan.md`).
          4. Провести испытания в Android 13 и Android 16 с сопоставимыми параметрами приложений.
          5. Собрать протоколы, журналы, скриншоты и машинно-читаемые результаты; проверить воспроизводимость.
          6. Провести сравнительный анализ, определить ограничения экспериментов и сформулировать выводы.
          7. Оформить расчётно-пояснительную записку и инструкцию по воспроизведению исследования.

          ## 3. Границы исследования

          **В практической части:** Application Sandbox (UID, приватные файлы), IPC/ContentProvider, runtime permissions, Scoped Storage, Android Keystore.

          **В теоретической части:** SELinux, Verified Boot, шифрование данных, подписывание приложений, TEE и StrongBox, модель многоуровневой защиты Android. Наличие системного свойства или ответа API не считается доказательством аппаратной стойкости.

          Испытания проводятся на стандартных, непривилегированных приложениях без root и без попыток компрометации операционной системы. Используются только синтетические данные. **Эмулятор не равнозначен физическому смартфону** и не подтверждает аппаратные свойства защиты.

          ## 4. Экспериментальная база

          - **ОС испытаний:** Android 13 / API 33 и Android 16 / API 36.
          - **Тип среды:** Android Emulator на GitHub-hosted runner, без обязательного локального эмулятора.
          - **Приложения:** `owner` и `client` (Kotlin, отдельные package name и UID).
          - **Управление:** AndroidX Test, ADB, Gradle, Python (анализ протоколов).
          - **Сравнение:** одинаковые версии исходного кода, `targetSdk`, манифесты, наборы разрешений, данные и сценарии, кроме явно описанных контрольных условий.
          - **Воспроизводимость:** фиксировать Git commit SHA, API, Android build fingerprint, `targetSdk`, версию APK, состояние разрешений, время и идентификатор запуска GitHub Actions.

          Версии Gradle, Kotlin, Android Gradle Plugin и зависимостей закрепляются после первой успешной сборки. Не допускается скрытая смена версии целевого SDK между сравниваемыми запусками.

          ## 5. Этапы и критерии завершения

          | Этап | Содержание | Условие завершения |
          |---|---|---|
          | 0 | Проектирование | Согласованы план, архитектура, методика и формулировка задания |
          | 1 | Исправление существующей сборки | `owner` и `client` собираются в CI, результаты сборки доступны |
          | 2 | Sandbox и IPC (S1–S5) | 5 сценариев исполнены на API 33 и API 36, получены протоколы |
          | 3 | Runtime Permissions (P1–P3) | 3 сценария исполнены, фиксируются состояния до/после изменения разрешения |
          | 4 | Scoped Storage (F1–F3) | 3 сценария исполнены с учётом согласия пользователя и ограничений эмулятора |
          | 5 | Android Keystore (K1–K3) | 3 сценария исполнены, указаны ограничения аппаратных выводов |
          | 6 | Сводное исследование | Полная матрица 14 × 2; каждый опыт имеет статус и подтверждение |
          | 7 | Пояснительная записка | Готов DOCX/RTF для преподавателя, PDF для просмотра, список источников и приложения |

          ## 6. Критерии качества и учёт результатов

          - Для каждого опыта определены: ID, гипотеза, предусловия, шаги, ожидаемое поведение, фактические наблюдения, критерий оценки.
          - **PASS** — фактическое поведение совпало с ожидаемым; запрет доступа тоже может быть PASS.
          - **FAIL** — поведение не совпало с гипотезой либо выявлена ошибка проверяемой реализации; причина должна быть разобрана.
          - **ERROR** — испытание технически не выполнено из-за ошибки сборки, установки или инфраструктуры.
          - **INCONCLUSIVE** — данных недостаточно для вывода; нужен повторный опыт или другая методика.
          - Не подменять результаты ожидаемыми значениями. До настоящего запуска статусы должны быть `NOT_RUN`.
          - Журналы и JSON из CI — основное свидетельство выполнения; скриншоты дополняют их, но не заменяют.
          - Код и методика должны позволять воспроизвести испытания на чистом эмуляторе.

          ## 7. Планируемая структура пояснительной записки

          1. Введение: актуальность, цель, задачи, объект, предмет, методика.
          2. Архитектура и основные механизмы безопасности Android.
          3. Архитектура и реализация экспериментального стенда.
          4. Методика проведения экспериментов.
          5. Результаты тестирования и сравнительный анализ.
          6. Ограничения исследования и заключение.
          7. Список источников и приложения (конфигурации, код, протоколы, скриншоты).

          **Рабочий ориентир:** 35–45 страниц основного текста, если преподаватель не установит другой объём. Это не нормативное требование из выданных документов.

          ## 8. Результаты, подлежащие сдаче

          - Два Android-модуля и инструкции по их сборке.
          - Набор воспроизводимых тестов, скрипты запуска и публикации результатов.
          - Таблица 14 сценариев × 2 версии Android с обоснованными статусами.
          - Артефакты CI: JSON, логи, при необходимости скриншоты и APK.
          - Пояснительная записка и отдельная инструкция по повторению экспериментов.

          ## 9. Основные источники для начала исследования

          - AOSP: Application Sandbox — https://source.android.com/docs/security/app-sandbox
          - Android Developers: Security checklist — https://developer.android.com/privacy-and-security/security-tips
          - Android Developers: Data and file storage — https://developer.android.com/training/data-storage
          - Android Developers: Android Keystore — https://developer.android.com/privacy-and-security/keystore

          Теоретическая глава и библиографический список будут расширены после проверки источников и их применимости к выбранным версиям ОС.
          ANDROID_SECURITY_DOC_0
            echo "Created: docs/project-plan.md"
          fi

          if [ -e "docs/architecture.md" ]; then
            echo "Skipping existing file: docs/architecture.md"
          else
            cat > "docs/architecture.md" <<'ANDROID_SECURITY_DOC_1'
          # Архитектура Android Security Lab

          **Статус:** проект архитектуры; её реализация будет проводиться поэтапно.

          ## 1. Назначение

          Стенд предназначен для воспроизводимых испытаний встроенных механизмов безопасности Android на двух версиях ОС. Он не является средством взлома или оценкой безопасности конкретного коммерческого смартфона.

          ## 2. Компоненты

          ```text
          GitHub repository
            |
            +-- owner/                 Android-приложение: владелец ресурсов
            +-- client/                Android-приложение: независимый тестовый клиент
            +-- automation/            Запуск, разбор протоколов, публикация
            +-- experiments/           Описание гипотез, шагов и ожидаемых результатов
            +-- results/               Сводные результаты (не громоздкие сырые логи)
            +-- docs/                  План, архитектура, скриншоты, отчёт
            +-- .github/workflows/     Сборка, испытания, обновление README

                                GitHub Actions
                                        |
                                Build APK + tests
                                        |
                           +------------+------------+
                           |                         |
                      Android 13                 Android 16
                        API 33                     API 36
                           |                         |
                         owner                     owner
                         client                    client
                           |                         |
                       test reports              test reports
                           +------------+------------+
                                        |
                              JSON / logs / PNG
                                        |
                              README + Artifacts
          ```

          ## 3. Android-приложения

          ### `owner`

          Отдельное Android-приложение, которое хранит синтетические данные, создаёт файл в приватной директории, содержит закрытый, открытый и защищённый разрешением ContentProvider, а также в последующих этапах выполняет операции с Android Keystore и общим хранилищем.

          ### `client`

          Отдельное Android-приложение с собственным UID, которое пытается получить доступ к ресурсам `owner` только через обычные пользовательские API. Отказы в доступе и разрешённые операции фиксируются в структурированном отчёте.

          В тестах запрещено выполнять попытку доступа от имени привилегированного ADB-shell вместо `client`: это нарушает смысл проверки песочницы. ADB допускается только для установки приложений, подготовки окружения, считывания журналов и управления разрешениями по методике.

          ## 4. Система испытаний

          - Источник истины — наблюдаемая операция в процессе `owner` или `client`.
          - Тестовые данные заранее заданы и не содержат личных сведений.
          - На каждом API устройства запускаются из чистого или документированного состояния; установка и удаление приложений выполняются предсказуемо.
          - Для сравнения API 33 и API 36 используется один Git-коммит и согласованные параметры сборки.
          - `targetSdk` сохраняется одинаковым для базового сравнения; при изучении поведения, зависящего от `targetSdk`, проводится отдельная серия с чёткой маркировкой.
          - При изменении состояния разрешений (выдача/отзыв) выполняется проверка именно текущего состояния приложения, а не только результат команды ADB.
          - Примерные длительности и число повторов определяются после первого устойчивого запуска. Для нестабильных сценариев необходимо повторение и протоколирование.

          ## 5. Поток данных

          1. GitHub Actions собирает APK и инструментированные тесты.
          2. На чистом эмуляторе устанавливаются оба приложения.
          3. Тестовые сценарии запускаются в нужном пользовательском процессе.
          4. Исполнитель сохраняет JSON-отчёт с результатом каждого ID (S1–K3), параметрами среды и ссылкой на исходный коммит.
          5. Дополнительно сохраняются `logcat`, XML/JUnit и подходящие PNG-скриншоты.
          6. Сырые материалы остаются в Artifacts запуска; в репозиторий записываются лишь сводные данные, проверенные скриншоты и ссылки на запуск.
          7. `README.md` обновляется внутри специально размеченного раздела, без удаления существующего содержания.

          Минимальная запись результата:

          ```json
          {
            "experiment_id": "S2",
            "api_level": 33,
            "status": "NOT_RUN",
            "expected": "direct_cross_app_private_file_read_denied",
            "observed": null,
            "commit_sha": null,
            "workflow_run_url": null
          }
          ```

          Этот JSON — **пример схемы**, а не результат настоящего эксперимента.

          ## 6. Организация GitHub Actions

          - `emulator-readiness.yml` — базовая проверка запуска эмуляторов; после утверждения именований можно переименовать существующий рабочий workflow.
          - `project-update.yml` — одноразовое или контролируемое пакетное обновление исходников; не должно безусловно затирать ручные изменения.
          - `android-tests.yml` — сборка, установка приложений, запуск полного набора тестов и выгрузка артефактов.
          - Для этапа 0 используется отдельный одноразовый `docs-bootstrap.yml`, **не запускающий эмулятор и не меняющий Gradle**.

          **Правило безопасности:** автоматические коммиты должны затрагивать только указанные файлы; обработка неполных результатов не должна выдавать успешные тесты. Для обновления защищённых веток могут потребоваться дополнительные разрешения.

          ## 7. Ограничения и угрозы достоверности

          1. Эмулятор моделирует программное поведение Android, но не доказывает защиту TEE/StrongBox или цепочки доверенной загрузки физического устройства.
          2. `SELinux=Enforcing` — наблюдаемое состояние, а не полноценная проверка политики SELinux.
          3. `getprop ro.boot.verifiedbootstate` не подтверждает аппаратную цепочку доверия в эмуляторе.
          4. Тесты разных `targetSdk`, разрешений или настроек нельзя напрямую сопоставлять без контроля этих параметров.
          5. Сценарии с системным интерфейсом выбора файла/разрешений могут требовать UI-автоматизации, и возможные ошибки автоматизации фиксируются отдельно от свойств ОС.
          6. Защита IPC зависит от `android:exported`, объявленных разрешений и подписи приложений: эти свойства фиксируются и не подменяются предположениями.

          ## 8. Ссылки на первичные источники

          - https://source.android.com/docs/security/app-sandbox
          - https://developer.android.com/privacy-and-security/security-tips
          - https://developer.android.com/training/data-storage
          - https://developer.android.com/privacy-and-security/keystore
          - https://github.com/ReactiveCircus/android-emulator-runner
          ANDROID_SECURITY_DOC_1
            echo "Created: docs/architecture.md"
          fi

          if [ -e "experiments/test-plan.md" ]; then
            echo "Skipping existing file: experiments/test-plan.md"
          else
            cat > "experiments/test-plan.md" <<'ANDROID_SECURITY_DOC_2'
          # Методика экспериментального исследования

          **Тема:** встроенные механизмы безопасности Android.

          **Статус:** спецификация до реализации. Ни один из результатов ниже не считается полученным без записи CI.

          ## Общие условия и интерпретация

          - Версии ОС: Android 13 (API 33) и Android 16 (API 36).
          - Используются два приложения с разными UID — `owner` и `client`; данные только синтетические.
          - В каждой базовой паре испытаний совпадают APK, `targetSdk`, манифесты и тестовые данные, различается версия Android. Особые случаи фиксируются отдельно.
          - Перед запуском сценария фиксируются набор предоставленных разрешений, установленные пакеты и состояние тестовых ресурсов.
          - Попытки из `client` исполняются именно внутри его процесса, без root и без подмены вызова ADB-shell.
          - Отдельно фиксируются реакция ОС (например, `SecurityException`, недоступность URI, разрешённая операция) и итоговый статус относительно гипотезы. Точный тип исключения может зависеть от версии ОС.
          - Результат `PASS` означает подтверждение ожидаемого поведения, включая блокировку доступа. Неуспешную установку APK или падение CI нельзя отмечать `PASS`.

          ## A. Application Sandbox — 2 сценария

          | ID | Гипотеза | Методика | Ожидаемое поведение |
          |---|---|---|---|
          | **S1** | Владелец может читать собственные приватные данные | `owner` создаёт файл в `filesDir` и считывает записанный маркер | Корректное чтение тестового маркера |
          | **S2** | Приложение с иным UID не может напрямую читать приватный файл `owner` | `client` выполняет обычное файловое чтение приватного пути `owner`; путь передаётся только как тестовая константа, не как открытый provider | Доступ не предоставлен; содержимое файла не раскрыто |

          **Контроль:** в S2 файл действительно создан, его содержимое проверено через S1; невозможность чтения не является следствием отсутствующего файла.

          ## B. Межпроцессное взаимодействие (IPC) — 3 сценария

          | ID | Гипотеза | Методика | Ожидаемое поведение |
          |---|---|---|---|
          | **S3** | `exported=false` запрещает доступ стороннему приложению к ContentProvider | `client` обращается к тестовому URI закрытого provider | Доступ запрещён, данные не возвращаются |
          | **S4** | `exported=true` без дополнительной защиты допускает контролируемый обмен | `client` обращается к явно опубликованному provider с несекретным тестовым маркером | Чтение разрешено, возвращён ожидаемый маркер |
          | **S5** | Дополнительное разрешение ограничивает доступ к экспортированному provider | `owner` объявляет provider, защищённый явным разрешением; `client` не обладает требуемым разрешением | Запрос не получает защищённые данные |

          **Контроль:** для S5 фиксируются `android:permission`, `protectionLevel`, список разрешений клиента и подписи APK. Если будет выбран `signature`, приложения должны иметь разные ключи; одинаковая debug-подпись может автоматически удовлетворить условию. Более простой базовый вариант — пользовательское `normal`-разрешение, не заявленное в манифесте `client`.

          ## C. Runtime Permissions — 3 сценария

          Для минимизации зависимости от оборудования исследуется разрешение `android.permission.CAMERA`, но проверяется **модель выдачи разрешения**, а не качество работы физической камеры.

          | ID | Гипотеза | Методика | Ожидаемое поведение |
          |---|---|---|---|
          | **P1** | До выдачи опасного разрешения приложение не обладает им | Установить приложение, сбросить разрешения, выполнить `checkSelfPermission` | `PERMISSION_DENIED` |
          | **P2** | После явной выдачи состояние разрешения меняется | Предоставить `CAMERA` стандартной процедурой через UI или документированную команду тестового окружения, запросить `checkSelfPermission` | `PERMISSION_GRANTED` |
          | **P3** | После отзыва доступ по этому разрешению снова отсутствует | Отозвать ранее выданное разрешение, при необходимости перезапустить процесс и повторить проверку | `PERMISSION_DENIED` |

          **Контроль:** логировать результат выдачи/отзыва и наблюдаемое состояние внутри приложения; не считать вывод ADB сам по себе подтверждением реакции Android API.

          ## D. Scoped Storage — 3 сценария

          | ID | Гипотеза | Методика | Ожидаемое поведение |
          |---|---|---|---|
          | **F1** | Приложение может работать со своими файлами без доступа к чужим каталогам | Создать и прочитать данные в собственной app-specific области | Операция разрешена |
          | **F2** | Прямое чтение приватной области данных другого приложения на внешнем хранилище ограничено | `owner` создаёт файл в собственной внешней app-specific директории; `client` обращается к этому пути без предоставления доступа | Чтение не разрешено |
          | **F3** | Пользователь может предоставить приложению доступ к выбранному документу через системный интерфейс | Через Storage Access Framework (`ACTION_OPEN_DOCUMENT`) выбрать тестовый документ, затем прочитать предоставленный URI | При явном выборе документа чтение разрешено |

          **Контроль:** F3 требует управляемого системного диалога; при нестабильности UI-автоматизации следует ставить `INCONCLUSIVE`, а не подменять пользовательское согласие прямой выдачей привилегий. Реализацию `MediaStore` и частичных разрешений для фотографий можно изучить отдельно, если потребуется углубление.

          ## E. Android Keystore — 3 сценария

          | ID | Гипотеза | Методика | Ожидаемое поведение |
          |---|---|---|---|
          | **K1** | Приложение может создавать и использовать собственный ключ через Android Keystore | `owner` создаёт AES-ключ в `AndroidKeyStore`, выполняет шифрование/расшифрование тестовой строки | Расшифрованная строка совпадает с исходной |
          | **K2** | Ключ, созданный как неэкспортируемый в Android Keystore, нельзя извлечь через стандартный API | `owner` пытается получить исходный ключевой материал через `SecretKey.getEncoded()` | Ключевые байты не возвращаются (`null`) |
          | **K3** | Другое приложение не имеет доступа к записи ключа, созданной `owner` | `client` открывает собственный `AndroidKeyStore` и ищет alias, созданный `owner` | Запись отсутствует в пространстве ключей `client` |

          **Контроль:** результат K2 касается стандартного API, а не доказательства физической невозможности извлечения ключа. Поддержку аппаратного хранения и уровень защиты необходимо исследовать отдельно, без вывода об их наличии на эмуляторе.

          ## Матрица запуска

          Все 14 сценариев выполняются как минимум по одному разу на каждой версии: **14 × 2 = 28 логических проверок**. Технические повторы не увеличивают число уникальных сценариев.

          | Группа | ID | API 33 | API 36 |
          |---|---|---|---|
          | Sandbox | S1–S2 | NOT_RUN | NOT_RUN |
          | IPC | S3–S5 | NOT_RUN | NOT_RUN |
          | Permissions | P1–P3 | NOT_RUN | NOT_RUN |
          | Scoped Storage | F1–F3 | NOT_RUN | NOT_RUN |
          | Keystore | K1–K3 | NOT_RUN | NOT_RUN |

