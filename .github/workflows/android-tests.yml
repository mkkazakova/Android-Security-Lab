name: Android Security Lab - Complete Experiments

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-complete-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Android API ${{ matrix.api }} - all scenarios
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [33, 36]
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - name: Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Install build platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Verify new files
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/run-tests.sh scripts/run-stage3.sh
          python3 -m py_compile scripts/storage-tests.py scripts/publish-results.py
          test -f owner/src/main/java/org/example/securitylab/owner/StorageProbeActivity.kt
          test -f client/src/main/java/org/example/securitylab/client/StorageProbeActivity.kt
      - name: Build Android applications
        run: ./gradlew :owner:assembleDebug :client:assembleDebug --no-daemon --stacktrace
      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Run all current experiments
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          cores: 2
          script: bash scripts/run-tests.sh
      - name: Summarize observed results
        if: always()
        shell: bash
        env:
          TEST_API: ${{ matrix.api }}
        run: |
          report="results/stage1-api-${TEST_API}/report.json"
          {
            echo "### Android API ${TEST_API}"
            if [ -f "$report" ]; then
              echo '```json'
              cat "$report"
              echo '```'
            else
              echo 'No report: inspect build, emulator, or test script logs.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: securitylab-api-${{ matrix.api }}
          path: results/stage1-api-${{ matrix.api }}/
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish README, JSON and screenshots
    needs: test
    if: ${{ always() && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout latest README
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - name: Retrieve this run's reports
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: securitylab-api-*
          path: downloaded
          merge-multiple: false
      - name: Generate current README from actual evidence
        shell: bash
        run: python3 scripts/publish-results.py
      - name: Commit report data (no workflow changes)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- README.md results/ docs/screenshots/
          if git diff --cached --quiet; then
            echo 'No changes to reports.'
          else
            git commit -m 'docs: publish Android security experiment results [skip ci]'
            git push origin "HEAD:${{ github.ref_name }}"
          fi
